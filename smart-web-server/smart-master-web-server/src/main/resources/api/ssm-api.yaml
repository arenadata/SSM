openapi: 3.0.1
info:
  description: SSM REST service specification
  version: 1.0.0
  title: SSM API Documentation
tags:
  - name: Rules
  - name: Cmdlets
  - name: Actions
  - name: Files
  - name: Cluster
  - name: Clusters
  - name: ReplicationPolicies
  - name: Audit
  - name: Hive
  - name: System

servers:
  - url: http://localhost:8081
    description: Local SSM server url

paths:
  # Rules
  /api/v2/rules:
    $ref: './resources/rules.yaml'
  /api/v2/rules/{id}:
    $ref: './resources/rule.yaml'
  /api/v2/rules/{id}/start:
    $ref: './resources/rule-start.yaml'
  /api/v2/rules/{id}/stop:
    $ref: './resources/rule-stop.yaml'
  /api/v2/rules/info:
    $ref: './resources/rules-info.yaml'

  # Cmdlets
  /api/v2/cmdlets:
    $ref: './resources/cmdlets.yaml'
  /api/v2/cmdlets/{id}:
    $ref: './resources/cmdlet.yaml'
  /api/v2/cmdlets/{id}/stop:
    $ref: './resources/cmdlet-stop.yaml'

  # Actions
  /api/v2/actions:
    $ref: './resources/actions.yaml'
  /api/v2/actions/{id}:
    $ref: './resources/action.yaml'

  # Files
  /api/v2/files/access-counts:
    $ref: './resources/files-access-counts.yaml'
  /api/v2/files/cached:
    $ref: './resources/files-cached.yaml'

  # Cluster
  /api/v2/cluster/nodes:
    $ref: './resources/cluster-nodes.yaml'

  # Clusters
  /api/v2/clusters:
    $ref: './resources/clusters.yaml'
  /api/v2/clusters/{id}:
    $ref: './resources/cluster.yaml'
  /api/v2/clusters/{id}/complete:
    $ref: './resources/cluster-complete.yaml'

  # Replication policies
  /api/v2/replication-policies:
    $ref: './resources/replication-policies.yaml'
  /api/v2/replication-policies/info:
    $ref: './resources/replication-policies-info.yaml'
  /api/v2/replication-policies/tags:
    $ref: './resources/replication-policies-tags.yaml'
  /api/v2/replication-policies/{id}:
    $ref: './resources/replication-policy.yaml'
  /api/v2/replication-policies/{id}/start:
    $ref: './resources/replication-policy-start.yaml'
  /api/v2/replication-policies/{id}/pause:
    $ref: './resources/replication-policy-pause.yaml'
  /api/v2/replication-policies/{id}/complete:
    $ref: './resources/replication-policy-complete.yaml'

  # Audit
  /api/v2/audit/events:
    $ref: './resources/audit-events.yaml'

  # Hive
  /api/v2/hive/databases:
    $ref: './resources/hive-databases.yaml'
  /api/v2/hive/databases/{dbName}:
    $ref: './resources/hive-database.yaml'
  /api/v2/hive/databases/{dbName}/tables/{tableName}:
    $ref: './resources/hive-table.yaml'
  /api/v2/hive/tables:
    $ref: './resources/hive-tables.yaml'

  # System
  /api/v2/system/current-user:
    $ref: './resources/current-user.yaml'

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic

security:
  - basicAuth: []
