title: Cluster
type: object
properties:
  id:
    type: integer
    format: int64
    description: Cluster id
  name:
    type: string
    description: Unique name of the cluster
  status:
    $ref: './ClusterStatus.yaml'
  hdfsUri:
    type: string
    description: URI of the cluster HDFS, where the data is replicated
  hiveThriftUri:
    type: string
    nullable: true
    description: URI of the cluster Hive Metastore, where the metadata is replicated
  hdfsNameservice:
    type: string
    nullable: true
    description: |
      Nameservice of the cluster HDFS, which replaces the source HDFS nameservice
      in the replicated metadata
  createTime:
    type: integer
    format: int64
    description: UNIX timestamp (UTC) of the cluster creation
  updateTime:
    type: integer
    format: int64
    description: UNIX timestamp (UTC) of the last cluster update
required:
  - id
  - name
  - status
  - hdfsUri
  - createTime
  - updateTime
