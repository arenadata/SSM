title: ReplicationSource
type: object
description: |
  Source Hive entities of the replication policy. If neither tables, nor table name regex
  are specified, the whole databases are replicated
properties:
  databases:
    type: array
    minItems: 1
    description: Names of the source Hive databases
    items:
      type: string
  tables:
    type: array
    nullable: true
    description: Exact tables of the selected databases. Can't be set along with the table name regex
    items:
      $ref: './ReplicationSourceTable.yaml'
  tableNameRegex:
    type: string
    nullable: true
    description: Regex of the table names, applied to all the selected databases
required:
  - databases
