title: ReplicationSource
type: object
description: |
  Source Hive entities of the replication policy. If neither tables, nor table name pattern
  are specified, the whole databases are replicated
properties:
  databases:
    type: array
    minItems: 1
    description: Names of the source Hive databases
    items:
      type: string
  tables:
    type: array
    nullable: true
    description: Exact tables of the selected databases. Can't be set along with the table name pattern
    items:
      $ref: './ReplicationSourceTable.yaml'
  tableNameRegex:
    type: string
    nullable: true
    description: |
      Glob pattern of the table names (`*` matches any sequence of characters,
      `?` matches any single character), applied to all the selected databases
required:
  - databases
