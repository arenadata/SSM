title: HiveTable
type: object
properties:
  dbName:
    type: string
    description: Name of the database the table belongs to
  name:
    type: string
    description: Name of the table
  catalogName:
    type: string
    nullable: true
    description: Name of the Hive catalog the table belongs to
  location:
    type: string
    description: Location of the table in the file system
required:
  - dbName
  - name
  - location
