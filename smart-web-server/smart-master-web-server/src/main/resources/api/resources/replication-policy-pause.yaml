post:
  tags:
    - ReplicationPolicies
  summary: Pause replication policy
  description: Suspends the active policy
  operationId: pauseReplicationPolicy
  parameters:
    - $ref: '../parameters/common/id.yaml'
  responses:
    '200':
      description: OK
    '400':
      description: Unsupported status transition
