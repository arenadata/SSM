version: "3.8"
services:

  hadoop-namenode:
    image: hub.adsw.io/ssm/ssm-hadoop-base:${HADOOP_VERSION:-3.3.6}
    hostname: hadoop-namenode.demo
    container_name: hadoop-namenode
    restart: unless-stopped
    volumes:
      - hadoop-namenode:/hadoop/dfs/name
      - secrets:/etc/secrets
      - ./kerberos/krb5.conf:/etc/krb5.conf
      - ./conf:/etc/conf
      - ./common.sh:/common.sh
      - ./namenode/healthcheck-hadoop-namenode.sh:/healthcheck-hadoop-namenode.sh
      - ./namenode/hadoop-namenode-entrypoint.sh:/hadoop-namenode-entrypoint.sh
    entrypoint: [ "/hadoop-namenode-entrypoint.sh" ]
    ports:
      - "9870:9870"
      - "8020:8020"
    environment:
      HDFS_PARENT_DATA_DIR: /hadoop/dfs
      HDFS_CONF_dfs_namenode_name_dir: file:///hadoop/dfs/name
    env_file:
      - hadoop.env
    healthcheck:
      test: ["CMD-SHELL", "bash /healthcheck-hadoop-namenode.sh"]
      interval: 30s
      timeout: 15s
      retries: 5
    networks:
      - demo
    depends_on:
      - hadoop-datanode

  hadoop-datanode:
    image: hub.adsw.io/ssm/ssm-hadoop-base:${HADOOP_VERSION:-3.3.6}
    hostname: hadoop-datanode.demo
    container_name: hadoop-datanode
    restart: unless-stopped
    volumes:
      - ssm-shared:/etc/ssm/shared
      - hadoop-datanode-data:/hadoop/dfs/data
      - hadoop-datanode-ram-data:/hadoop/dfs/ram-data
      - hadoop-datanode-ssd-data:/hadoop/dfs/ssd-data
      - hadoop-datanode-archive-data:/hadoop/dfs/archive-data
      - secrets:/etc/secrets
      - ./kerberos/krb5.conf:/etc/krb5.conf
      - ./conf:/etc/conf
      - ./conf:/opt/ssm/conf
      - ./ssm-conf/smart-site-agent.xml:/opt/ssm/conf/smart-site.xml
      - ./datanode/hadoop-datanode-entrypoint.sh:/hadoop-datanode-entrypoint.sh
    entrypoint: ["/hadoop-datanode-entrypoint.sh"]
    ports:
      - "9864:9864"
      - "7048:7048"
      - "7051:7051"
      # SSM Agent web server port
      - "18081:8081"
      # JMX port
      - "3334:3334"
      # agent debug port
      - "8009:8008"
    environment:
      SSM_DEBUG_OPT: ${SSM_DEBUG_OPT}
    env_file:
      - hadoop.env
    healthcheck:
      test: ["CMD-SHELL", "curl http://hadoop-datanode.demo:1006 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
    networks:
      - demo
    depends_on:
      - ssm-server

  ssm-server:
    image: hub.adsw.io/ssm/ssm-server:${SSM_VERSION:-2.2.0-SNAPSHOT}
    hostname: ssm-server.demo
    container_name: ssm-server
    restart: unless-stopped
    volumes:
      - ssm-shared:/tmp/shared
      - secrets:/etc/secrets
      - ./kerberos/krb5.conf:/etc/krb5.conf
      - ./conf:/opt/ssm/conf
      - ./ssm-conf/smart-site-master.xml:/opt/ssm/conf/smart-site.xml
      - ./common.sh:/common.sh
      - ./ssm/ssm-server-entrypoint.sh:/ssm-server-entrypoint.sh
    entrypoint: ["/ssm-server-entrypoint.sh"]
    ports:
      - "7042:7042"
      - "8081:8081"
      # JMX port
      - "3333:3333"
      # ssm debug port
      - "8008:8008"
    environment:
      SSM_DEBUG_OPT: ${SSM_DEBUG_OPT}
    healthcheck:
      test: ["CMD-SHELL", "curl http://ssm-server.demo:8081 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
    networks:
      - demo
    depends_on:
      - ssm-metastore-db
      - kdc-server

  ssm-metastore-db:
    image: "docker.io/library/postgres:14.0"
    restart: unless-stopped
    container_name: ssm-metastore-db.demo
    hostname: ssm-metastore-db
    environment:
      POSTGRES_DB: 'metastore'
      POSTGRES_USER: 'ssm'
      POSTGRES_PASSWORD: 'ssm'
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "psql -d metastore -U ssm -Atc 'SELECT 1;'"]
      interval: 30s
      timeout: 15s
      retries: 3
    volumes:
      - ./db/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - demo

  kdc-server:
    image: hub.adsw.io/java/kdc-server:latest
    restart: unless-stopped
    container_name: kdc-server
    hostname: kdc-server.demo
    volumes:
      - secrets:/tmp/secrets
      - ./kerberos/krb5.conf:/etc/krb5.conf
      - ./kerberos/kdc.conf:/etc/krb5kdc/kdc.conf
      - ./kerberos/kdc.conf:/var/kerberos/krb5kdc/kdc.conf
      - ./kerberos/kadm5.acl:/etc/krb5kdc/kadm5.acl
      - ./kerberos/kdc-init.sh:/tmp/kdc-init.sh
    ports:
      - "749:749"
      - "88:88/udp"
    healthcheck:
      test: ["CMD-SHELL", "bash -c echo -n '' > /dev/tcp/kdc-server.demo/749"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - demo

  samba:
    image: hub.adsw.io/java/samba:latest
    hostname: samba
    container_name: samba
    privileged: true
    ports:
      - "389:389"
    environment:
      SMB_ADMIN_PASSWORD: "LZ2ibGAn2H0D0UW3"
    volumes:
      - ./ldap:/opt/ad-scripts
    healthcheck:
      test: ["CMD-SHELL", "ps -e | grep samba"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - demo

  hive-metastore:
    image: apache/hive:4.0.1
    container_name: hive-metastore
    hostname: hive-metastore.demo
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://ssm-metastore-db/hive
        -Djavax.jdo.option.ConnectionUserName=ssm
        -Djavax.jdo.option.ConnectionPassword=ssm
        -Dhive.metastore.event.listeners=org.apache.hive.hcatalog.listener.DbNotificationListener
        -Dhive.metastore.event.db.listener.timetolive=86400s
        -Dhive.metastore.warehouse.dir=hdfs://hadoop-namenode.demo:8020/user/hive/warehouse
    volumes:
      - ./db/postgresql-42.2.16.jre7.jar:/opt/hive/lib/postgres.jar
      - secrets:/etc/secrets
      - ./kerberos/krb5.conf:/etc/krb5.conf
      - ./hive/hive-site.xml:/opt/hive/conf/hive-site.xml
      - ./hive/core-site.xml:/opt/hive/conf/core-site.xml
    ports:
      - "9083:9083"
    networks:
      - demo

  hive-server2:
    image: apache/hive:4.0.1
    container_name: hive-server2
    hostname: hive-server2.demo
    depends_on:
      hive-metastore:
        condition: service_started
      hadoop-namenode:
        condition: service_healthy
    environment:
      SERVICE_NAME: hiveserver2
      IS_RESUME: true
      SERVICE_OPTS: >-
        -Dhive.metastore.uris=thrift://hive-metastore.demo:9083
        -Dhive.metastore.warehouse.dir=hdfs://hadoop-namenode.demo:8020/user/hive/warehouse
    healthcheck:
      test: [ "CMD", "sh", "-c", "beeline -u 'jdbc:hive2://localhost:10000/'" ]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - secrets:/etc/secrets
      - ./kerberos/krb5.conf:/etc/krb5.conf
      - ./hive/hive-site.xml:/opt/hive/conf/hive-site.xml
      - ./hive/core-site.xml:/opt/hive/conf/core-site.xml
    ports:
      - "10000:10000"
      - "10002:10002"
    networks:
      - demo

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./conf/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9090"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - demo

networks:
  demo:
    name: demo

volumes:
  ssm-shared:
  hadoop-namenode:
  hadoop-datanode-data:
  hadoop-datanode-ram-data:
  hadoop-datanode-ssd-data:
  hadoop-datanode-archive-data:
  secrets:
