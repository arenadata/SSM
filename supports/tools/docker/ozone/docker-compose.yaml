x-image:
  &image
  image: ${OZONE_IMAGE:-apache/ozone}:${OZONE_IMAGE_VERSION:-2.0.0}${OZONE_IMAGE_FLAVOR:-}

x-common-config:
  &common-config
  OZONE-SITE.XML_hdds.datanode.dir: "/data/hdds"
  OZONE-SITE.XML_ozone.metadata.dirs: "/data/metadata"
  OZONE-SITE.XML_ozone.om.address: "om"
  OZONE-SITE.XML_ozone.administrators: "hadoop,om,hdfs,${ADMIN_USER:-root}"
  OZONE-SITE.XML_ozone.om.http-address: "om:9874"
  OZONE-SITE.XML_ozone.recon.address: "recon:9891"
  OZONE-SITE.XML_ozone.recon.db.dir: "/data/metadata/recon"
  OZONE-SITE.XML_ozone.replication: "1"
  OZONE-SITE.XML_ozone.scm.block.client.address: "scm"
  OZONE-SITE.XML_ozone.scm.client.address: "scm"
  OZONE-SITE.XML_ozone.scm.datanode.id.dir: "/data/metadata"
  OZONE-SITE.XML_ozone.scm.names: "scm"
  no_proxy: "om,recon,scm,s3g,localhost,127.0.0.1"

version: "3"
services:
  datanode:
    <<: *image
    ports:
      - 9864
    command: [ "ozone","datanode" ]
    environment:
      <<: *common-config

  ssm-server:
    image: hub.adsw.io/ssm/ssm-server:${SSM_VERSION:-2.2.0-SNAPSHOT}
    volumes:
      - ./conf:/opt/ssm/conf
      - ./ssm/common.sh:/common.sh
      - ./ssm/ssm-server-entrypoint.sh:/ssm-server-entrypoint.sh
    entrypoint: ["/ssm-server-entrypoint.sh"]
    ports:
      - "7042:7042"
      - "8081:8081"
      # JMX port
      - "3333:3333"
      # ssm debug port
      - "8008:8008"
    environment:
      SSM_DEBUG_OPT: ${SSM_DEBUG_OPT}
    healthcheck:
      test: ["CMD-SHELL", "curl http://ssm-server:8081 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
    depends_on:
      - ssm-metastore-db

  ssm-metastore-db:
    image: "docker.io/library/postgres:14.0"
    restart: unless-stopped
    environment:
      POSTGRES_DB: 'metastore'
      POSTGRES_USER: 'ssm'
      POSTGRES_PASSWORD: 'ssm'
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "psql -d metastore -U ssm -Atc 'SELECT 1;'"]
      interval: 30s
      timeout: 15s
      retries: 3

  om:
    <<: *image
    ports:
      - 9874:9874
      - 9862:9862
    environment:
      <<: *common-config
      CORE-SITE.XML_hadoop.proxyuser.hadoop.hosts: "*"
      CORE-SITE.XML_hadoop.proxyuser.hadoop.groups: "*"
      ENSURE_OM_INITIALIZED: /data/metadata/om/current/VERSION
      WAITFOR: scm:9876
    command: [ "ozone","om" ]

  scm:
    <<: *image
    ports:
      - 9876:9876
    environment:
      <<: *common-config
      ENSURE_SCM_INITIALIZED: /data/metadata/scm/current/VERSION
    command: [ "ozone","scm" ]

  recon:
    <<: *image
    ports:
      - 9888:9888
    environment:
      <<: *common-config
    command: [ "ozone","recon" ]

  s3g:
    <<: *image
    ports:
      - 9878:9878
    environment:
      <<: *common-config
    command: [ "ozone","s3g" ]

  httpfs:
    <<: *image
    ports:
      - 14000:14000
    environment:
      <<: *common-config
      CORE-SITE.XML_fs.defaultFS: "ofs://om"
    command: [ "ozone","httpfs" ]