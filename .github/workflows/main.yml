name: PR and master push checks

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    strategy:
      matrix:
        hdfs-version: [ 3.3 ]
    runs-on: ubuntu-latest
    name: Build with HDFS ${{ matrix.hdfs-version }}
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: sh ./build-project.sh ${{ matrix.hdfs-version }}

      - name: Run integration tests
        run: mvn test -Dmaven.test.redirectTestOutputToFile=false -Phadoop-${{ matrix.hdfs-version }}

# Can't run test containers due to inaccessibility of cloud-hub.adsw.io github
