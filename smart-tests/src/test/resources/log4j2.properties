rootLogger = INFO, STDOUT

# LittleProxy (built-in Selenide proxy) logs cancelled upstream TLS handshakes at INFO
# with full stack traces. These come from Chrome background requests to Google services
# (safe browsing, variations, component updates) that Chrome itself aborts; they are
# harmless for tests. Set to OFF to hide completely.
logger.littleproxy.name = org.littleshoot.proxy
logger.littleproxy.level = warn

appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{ISO8601} %-5p %c{2} (%F:%M(%L)) - %m%n
