general:
  # env-type: docker|remote
  env-type: ${ENV_TYPE:docker}
  use-selenoid: ${CI:true}
  base-url: ${PROTOCOL:http}://${SSM_HOST:localhost}:${SSM_PORT:8081}

docker-compose-service:
  selenoid-compose-file-name: ${SELENOID_COMPOSE_FILE_NAME:target/common-resources/selenoid/docker-compose.yaml}
  compose-file-name: ${COMPOSE_FILE_NAME:target/test-classes/env/multihost/docker-compose.yaml}
  # container-management-strategy: generic|compose
  container-management-strategy: ${CONTAINER_MANAGEMENT_STRATEGY:generic}

selenoid:
  proxy-host: ${SELENOID_PROXY_HOST:172.17.0.1}
  ui-remote-hub: ${SELENOID_UI_REMOTE_HUB:http://localhost:4444/wd/hub}
  browser-name: ${DEFAULT_BROWSER_NAME:chrome}
  browser-version: ${DEFAULT_BROWSER_VERSION:stable}
  screenshot-successful-steps: true

logs:
  docker-logs-directory: target/allure-results
  docker-logs-archive-name: logs.zip

ssm-web:
  credentials:
    - role: OWNER
      login: john
      password: 1234
    - role: KERBEROS
      login: krb_user1@DEMO
      password: krb_pass1

remote:
  connectionTimeoutSec: 30
  services:
    - component: ssm-server
      ssh-config:
        host: ${SSM_HOST:localhost}
        port: 22
        authType: PUBLIC_KEY
        sshFilePath: "test.key"
        username: test
        password: test
      commands:
        startCommand:
        stopCommand:
    - component: ssm-metastore-db
      ssh-config:
        host: ${SSM_HOST:localhost}
        port: 22
        authType: PUBLIC_KEY
        sshFilePath: "test.key"
        username: test
        password: test
      commands:
        startCommand:
        stopCommand:
    - component: hadoop-namenode
      ssh-config:
        host: ${HADOOP_NAMENODE_HOST:localhost}
        port: 22
        authType: PUBLIC_KEY
        sshFilePath: "test.key"
        username: test
        password: test
      commands:
        startCommand:
        stopCommand:
    - component: hadoop-datanode
      ssh-config:
        host: ${HADOOP_DATANODE_HOST:localhost}
        port: 22
        authType: PUBLIC_KEY
        sshFilePath: "test.key"
        username: test
        password: test
      commands:
        startCommand:
        stopCommand:

ssm-metastore-db:
  datasource:
    jdbc-url: jdbc:postgresql://${METASTORE_DB_HOST:localhost}:5432/metastore
    username: ssm
    password: ssm
    schema: public
    driver-class-name: org.postgresql.Driver